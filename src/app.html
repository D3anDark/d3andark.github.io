<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#05040a" />
		<link rel="icon" href="https://cdn.deandark.me/logo.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/clash-display-semibold.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Runs before first paint: flags JS for the reveal styles and picks the
			// language (stored choice first, then the system list) for <html lang>.
			(function () {
				// Pages paths are case-sensitive and the Bingo project lives at /Bingo/,
				// so /bingo/... lands on this site's 404 page; send it on.
				var bingo = /^\/bingo(\/.*)?$/i.exec(location.pathname);
				if (bingo && location.pathname.slice(0, 6) !== '/Bingo') {
					location.replace('/Bingo' + (bingo[1] || '/') + location.search + location.hash);
					return;
				}
				var html = document.documentElement;
				html.classList.add('js');
				var lang;
				try { lang = localStorage.getItem('lang'); } catch (e) {}
				if (!lang) {
					var list = navigator.languages || [navigator.language || ''];
					for (var i = 0; i < list.length; i++) {
						var code = String(list[i]).slice(0, 2).toLowerCase();
						if (code === 'pl' || code === 'en') { lang = code; break; }
					}
				}
				if (lang === 'pl') html.lang = 'pl', html.classList.add('swap');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
